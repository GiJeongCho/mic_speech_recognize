[project]
name = "mic-speech-recognize"
version = "0.1.0"
description = "Multi-channel mic synchronization and speaker diarization API"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic",
    "numpy",
    "librosa",
    "soundfile",
    "scipy",
    "kiwipiepy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
